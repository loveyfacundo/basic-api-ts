name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

env:
  IMAGE_NAME: basic-api-ts

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calculate next image tag
        id: version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail

          repository="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          latest_tag=$(curl --fail --silent --show-error \
            "https://hub.docker.com/v2/repositories/${repository}/tags?page_size=100" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+([.]0)?$' \
            | sort -V \
            | tail -n 1 || true)

          if [[ -z "${latest_tag}" ]]; then
            next_tag="1.0"
          else
            next_major=$(awk -F. '{ print $1 + 1 }' <<< "${latest_tag}")
            next_tag="${next_major}.0"
          fi

          echo "Publishing ${repository}:${next_tag}"
          echo "tag=${next_tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
